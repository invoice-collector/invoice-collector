name: Check coding standards

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**/*.ts'
      - 'eslint.coding-standards.config.mjs'

jobs:
  check-coding-standards:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true
        token: ${{ secrets.PAT_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install project dependencies
      run: npm ci

    - name: Install lint tools
      run: npm install --no-save --package-lock=false eslint@^9.0.0

    - name: Check coding-standards
      run: npx eslint --config eslint.coding-standards.config.mjs 'src/**/*.ts'